<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.5" stop-color="#3b1d5e"/>
      <stop offset="1" stop-color="#8a1c4a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="holes" width="40" height="60" patternUnits="userSpaceOnUse">
      <rect width="40" height="60" fill="#0a0a14"/>
      <rect x="10" y="20" width="20" height="20" rx="4" fill="#2b2b44"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <polygon points="760,0 840,0 1180,900 420,900" fill="url(#beam)"/>
  <g filter="url(#blur)">
    <circle cx="220" cy="240" r="90" fill="#ff5d73" opacity="0.55"/>
    <circle cx="420" cy="620" r="120" fill="#ffb547" opacity="0.4"/>
    <circle cx="640" cy="160" r="60" fill="#8b6cff" opacity="0.6"/>
    <circle cx="1000" cy="700" r="140" fill="#ff5d73" opacity="0.35"/>
    <circle cx="1220" cy="220" r="100" fill="#ffb547" opacity="0.5"/>
    <circle cx="1440" cy="560" r="110" fill="#8b6cff" opacity="0.5"/>
    <circle cx="90" cy="740" r="70" fill="#8b6cff" opacity="0.5"/>
  </g>
  <g fill="#fff" opacity="0.7">
    <circle cx="300" cy="400" r="6"/><circle cx="560" cy="300" r="4"/><circle cx="900" cy="260" r="5"/>
    <circle cx="1100" cy="480" r="4"/><circle cx="1350" cy="380" r="6"/><circle cx="760" cy="600" r="3"/>
  </g>
  <rect x="0" y="0" width="1600" height="70" fill="url(#holes)"/>
  <rect x="0" y="830" width="1600" height="70" fill="url(#holes)"/>
  <rect x="0" y="70" width="1600" height="4" fill="#0a0a14"/>
  <rect x="0" y="826" width="1600" height="4" fill="#0a0a14"/>
</svg>
